name: Deploy

on:
  push:
    branches: [main, master, main-cnweb]
  pull_request:
    branches: [main, master, main-cnweb]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (contains(github.event.head_commit.modified, 'AIMS/aims-frontend') || contains(github.event.head_commit.added, 'AIMS/aims-frontend') || contains(github.event.head_commit.removed, 'AIMS/aims-frontend'))

    steps:
      - uses: actions/checkout@v3

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'AIMS/aims-frontend/**'

      - name: Login to Docker Hub
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend Docker image
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./AIMS/aims-frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aims-frontend:latest

      - name: Deploy Frontend to Render
        if: steps.filter.outputs.frontend == 'true'
        run: |
          curl --request POST \
           --url https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_FE }}/deploys \
           --header 'accept: application/json' \
           --header 'content-type: application/json' \
           --header 'authorization: Bearer ${{ secrets.RENDER_API_KEY }}' \
           --data '{"clearCache": "do_not_clear"}'

  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'AIMS/aims-backend/**'

      - name: Login to Docker Hub
        if: steps.filter.outputs.backend == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Docker image
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./AIMS/aims-backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/aims-backend:latest

      - name: Deploy Backend to Render
        if: steps.filter.outputs.backend == 'true'
        run: |
          curl --request POST \
           --url https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_BE }}/deploys \
           --header 'accept: application/json' \
           --header 'content-type: application/json' \
           --header 'authorization: Bearer ${{ secrets.RENDER_API_KEY }}' \
           --data '{"clearCache": "do_not_clear"}'
